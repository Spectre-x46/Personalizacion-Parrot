# ==========================================
# 🔇 GENERAL
# ==========================================
enable_audio_bell no
background_opacity 0.95
window_padding_width 8

# ==========================================
# 🔤 FUENTES
# ==========================================
font_family HackNerdFont
font_size 13
disable_ligatures never

# ==========================================
# 🔗 URLS
# ==========================================
url_color #61afef
url_style curly
detect_urls yes

# ==========================================
# 🖱️ CURSOR
# ==========================================
cursor_shape beam
cursor_beam_thickness 1.8
mouse_hide_wait 3.0

# ==========================================
# ⚡ RENDIMIENTO
# ==========================================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ==========================================
# 🧭 NAVEGACIÓN
# ==========================================
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# ==========================================
# 📋 CLIPBOARD
# ==========================================
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# ==========================================
# 🪟 VENTANAS Y TABS
# ==========================================
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+z toggle_layout stack

tab_bar_style powerline

inactive_tab_background #30363d
active_tab_background #3da9fc
inactive_tab_foreground #c9d1d9
tab_bar_margin_color black

# ==========================================
# 🐚 SHELL
# ==========================================
shell zsh

# ==========================================
# 🎨 PALETA PROTANOPIA (ALTO CONTRASTE)
# ==========================================

foreground #E6EDF3
background #0D1117

# Negro / gris
color0  #1f2933
color8  #6b7280

# Rojo (no principal)
color1  #ff7a7a
color9  #ff9b9b

# Verde → reemplazado por cian/azul
color2  #4cc9f0
color10 #72efdd

# Amarillo (flags)
color3  #ffd166
color11 #ffe08a

# Azul (comandos)
color4  #3da9fc
color12 #74c0fc

# Magenta (errores)
color5  #c77dff
color13 #d0aaff

# Cian (paths / funciones)
color6  #2ec4b6
color14 #64dfdf

# Blanco
color7  #e6edf3
color15 #ffffff
